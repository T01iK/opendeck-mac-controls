<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="stylesheet" href="pi.css" />
		<script src="pi.js"></script>
	</head>
	<body>
		<div class="row">
			<label for="metric">Metric</label>
			<div class="value">
				<select id="metric" data-setting="metric" data-default="cpu">
					<optgroup label="Load">
						<option value="cpu">CPU usage</option>
						<option value="memory">Memory used</option>
						<option value="gpu">GPU usage</option>
					</optgroup>
					<optgroup label="Power">
						<option value="battery">Battery</option>
					</optgroup>
					<optgroup label="Temperature">
						<option value="cpuTemp">CPU (SoC die)</option>
						<option value="ssdTemp">SSD</option>
						<option value="batteryTemp">Battery</option>
					</optgroup>
					<optgroup label="Network">
						<option value="network">Download + upload</option>
						<option value="networkIn">Download</option>
						<option value="networkOut">Upload</option>
					</optgroup>
					<optgroup label="Disk">
						<option value="disk">Read + write</option>
						<option value="diskRead">Read</option>
						<option value="diskWrite">Write</option>
					</optgroup>
				</select>
			</div>
		</div>
		<div class="row" data-show="metric=battery">
			<label for="batterySource">Source</label>
			<div class="value">
				<select id="batterySource">
					<option value="mac">This Mac</option>
				</select>
				<button id="reload" title="Reload devices">↻</button>
			</div>
		</div>
		<div class="row" id="graph-row">
			<label for="graph">Graph</label>
			<div class="value">
				<input id="graph" type="checkbox" data-setting="graph" data-default="true" />
				<label for="graph">Show last 30 seconds</label>
			</div>
		</div>
		<div class="row">
			<label for="press">On press</label>
			<div class="value">
				<select id="press" data-setting="press" data-default="activity">
					<option value="activity" id="open-option">Open Activity Monitor</option>
					<option value="none">Nothing</option>
				</select>
			</div>
		</div>
		<p class="hint">Updates every second. Network uses the primary interface (Wi-Fi or Ethernet).</p>
		<script>
			let batteries = [];

			function onConnected() {
				sendToPlugin({ request: "listBatteries" });
			}

			function onPluginMessage(payload) {
				if (!payload.batteries) return;
				batteries = payload.batteries;
				const select = document.getElementById("batterySource");
				const selected = settings.batterySource ?? "mac";
				select.replaceChildren(new Option("This Mac", "mac"));
				const group = document.createElement("optgroup");
				group.label = "Bluetooth";
				for (const device of batteries) group.appendChild(new Option(device.name, device.address));
				select.appendChild(group);
				if (selected !== "mac" && !batteries.some((d) => d.address === selected)) {
					select.add(new Option((settings.batteryName ?? "Device") + " (not paired)", selected));
				}
				select.value = selected;
			}

			document.getElementById("batterySource").onchange = (event) => {
				settings.batterySource = event.target.value;
				const device = batteries.find((d) => d.address === event.target.value);
				if (device) settings.batteryName = device.name;
				save();
			};

			document.getElementById("reload").onclick = () => sendToPlugin({ request: "listBatteries" });

			const baseRefresh = refreshVisibility;
			refreshVisibility = () => {
				baseRefresh();
				// The battery has its own layout without a history graph, and opens Battery settings instead.
				const battery = current("metric") === "battery";
				document.getElementById("graph-row").hidden = battery;
				document.getElementById("open-option").textContent = !battery
					? "Open Activity Monitor"
					: (settings.batterySource ?? "mac") === "mac" ? "Open Battery settings" : "Open Bluetooth settings";
			};
		</script>
	</body>
</html>
